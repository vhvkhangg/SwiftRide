name: Matching Service CI

on:
  push:
    branches: [main, master]
    paths:
      - "src/MatchingService/**"
      - "tests/MatchingService.Tests/**"
      - ".github/workflows/matching-ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "src/MatchingService/**"
      - "tests/MatchingService.Tests/**"

jobs:
  build-and-test:
    runs-on: ubuntu-22.04

    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\").ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore src/MatchingService/MatchingService.csproj

      - name: Build MatchingService
        run: dotnet build src/MatchingService/MatchingService.csproj --no-restore --configuration Release

      - name: Run Unit Tests
        run: dotnet test tests/MatchingService.Tests/MatchingService.Tests.csproj --configuration Release
