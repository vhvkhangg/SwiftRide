# Local development/test stack. Default credentials and JWT key are public test values only.
services:
  rabbitmq:
    image: rabbitmq:4.1.8-management
    hostname: swiftride-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-swiftride}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-swiftride_dev}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-swiftride}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_local_alarms"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  messaging-setup:
    build:
      context: .
      dockerfile: src/SwiftRide.Messaging.Setup/Dockerfile
    environment:
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__VirtualHost: ${RABBITMQ_VHOST:-swiftride}
      RabbitMq__Username: ${RABBITMQ_USER:-swiftride}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-swiftride_dev}
    depends_on:
      rabbitmq:
        condition: service_healthy

  trip-postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${TRIP_DB_NAME:-swiftride_trip}
      POSTGRES_USER: ${TRIP_DB_USER:-swiftride}
      POSTGRES_PASSWORD: ${TRIP_DB_PASSWORD:-swiftride_dev}
    ports:
      - "5433:5432"
    volumes:
      - trip-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TRIP_DB_USER:-swiftride} -d ${TRIP_DB_NAME:-swiftride_trip}"]
      interval: 5s
      timeout: 5s
      retries: 10

  matching-mongodb:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - matching-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  payment-postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${PAYMENT_DB_NAME:-swiftride_payment}
      POSTGRES_USER: ${PAYMENT_DB_USER:-swiftride}
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD:-swiftride_dev}
    ports:
      - "5434:5432"
    volumes:
      - payment-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PAYMENT_DB_USER:-swiftride} -d ${PAYMENT_DB_NAME:-swiftride_payment}"]
      interval: 5s
      timeout: 5s
      retries: 10

  trip-service:
    build:
      context: .
      dockerfile: src/TripService/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__TripDb: Host=trip-postgres;Port=5432;Database=${TRIP_DB_NAME:-swiftride_trip};Username=${TRIP_DB_USER:-swiftride};Password=${TRIP_DB_PASSWORD:-swiftride_dev}
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__VirtualHost: ${RABBITMQ_VHOST:-swiftride}
      RabbitMq__Username: ${RABBITMQ_USER:-swiftride}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-swiftride_dev}
    depends_on:
      rabbitmq:
        condition: service_healthy
      messaging-setup:
        condition: service_completed_successfully
      trip-postgres:
        condition: service_healthy
    ports:
      - "5101:8080"

  matching-service:
    build:
      context: .
      dockerfile: src/MatchingService/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__MatchDb: mongodb://matching-mongodb:27017/${MATCH_DB_NAME:-swiftride_matching}
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__VirtualHost: ${RABBITMQ_VHOST:-swiftride}
      RabbitMq__Username: ${RABBITMQ_USER:-swiftride}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-swiftride_dev}
    depends_on:
      rabbitmq:
        condition: service_healthy
      matching-mongodb:
        condition: service_healthy
      messaging-setup:
        condition: service_completed_successfully
    ports:
      - "5102:8080"

  payment-service:
    build:
      context: .
      dockerfile: src/PaymentService/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__PaymentDb: Host=payment-postgres;Port=5432;Database=${PAYMENT_DB_NAME:-swiftride_payment};Username=${PAYMENT_DB_USER:-swiftride};Password=${PAYMENT_DB_PASSWORD:-swiftride_dev}
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__VirtualHost: ${RABBITMQ_VHOST:-swiftride}
      RabbitMq__Username: ${RABBITMQ_USER:-swiftride}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-swiftride_dev}
    depends_on:
      rabbitmq:
        condition: service_healthy
      payment-postgres:
        condition: service_healthy
      messaging-setup:
        condition: service_completed_successfully
    ports:
      - "5103:8080"

  auth-postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: swiftride_auth
      POSTGRES_USER: swiftride
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-gateway_test_password}
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - auth-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 30
  api-gateway:
    build:
      context: .
      dockerfile: src/ApiGateway/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      AuthDatabase__EnsureCreated: "true"
      ConnectionStrings__AuthDb: Host=auth-postgres;Port=5432;Database=swiftride_auth;Username=swiftride;Password=${AUTH_DB_PASSWORD:-gateway_test_password}
      JwtSettings__SecretKey: ${JWT_SECRET_KEY:-swiftride-local-test-only-signing-key-at-least-32-bytes-2026}
      Routes__0__DownstreamHostAndPorts__0__Host: trip-service
      Routes__0__DownstreamHostAndPorts__0__Port: 8080
      Routes__1__DownstreamHostAndPorts__0__Host: matching-service
      Routes__1__DownstreamHostAndPorts__0__Port: 8080
      Routes__2__DownstreamHostAndPorts__0__Host: payment-service
      Routes__2__DownstreamHostAndPorts__0__Port: 8080
    depends_on:
      auth-postgres:
        condition: service_healthy
      trip-service:
        condition: service_started
      matching-service:
        condition: service_started
      payment-service:
        condition: service_started
    ports:
      - "5100:8080"

volumes:
  auth-postgres-data:
  trip-postgres-data:
  matching-mongo-data:
  payment-postgres-data:
