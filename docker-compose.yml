# Local development/test stack. Default credentials and keys are public test values only.
# User tokens are issued by Keycloak (realm swiftride) and validated through its JWKS.
x-service-security: &service-security
  Authentication__Authority: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}/realms/swiftride
  Authentication__MetadataAddress: http://keycloak:8080/realms/swiftride/.well-known/openid-configuration
  Authentication__RequireHttpsMetadata: "false"
  Authentication__Audience: swiftride-api
  ServiceAuth__SecretKey: ${SERVICE_AUTH_SECRET_KEY:-swiftride-local-internal-only-signing-key-at-least-32-bytes-2026}

services:
  rabbitmq:
    image: rabbitmq:4.1.8-management
    hostname: swiftride-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-swiftride}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-swiftride_dev}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-swiftride}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_local_alarms"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  messaging-setup:
    build:
      context: .
      dockerfile: src/SwiftRide.Messaging.Setup/Dockerfile
    environment:
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__VirtualHost: ${RABBITMQ_VHOST:-swiftride}
      RabbitMq__Username: ${RABBITMQ_USER:-swiftride}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-swiftride_dev}
    depends_on:
      rabbitmq:
        condition: service_healthy

  trip-postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${TRIP_DB_NAME:-swiftride_trip}
      POSTGRES_USER: ${TRIP_DB_USER:-swiftride}
      POSTGRES_PASSWORD: ${TRIP_DB_PASSWORD:-swiftride_dev}
    ports:
      - "5433:5432"
    volumes:
      - trip-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TRIP_DB_USER:-swiftride} -d ${TRIP_DB_NAME:-swiftride_trip}"]
      interval: 5s
      timeout: 5s
      retries: 10

  matching-mongodb:
    image: mongo:8
    environment:
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    ports:
      - "27017:27017"
    volumes:
      - matching-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  payment-postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${PAYMENT_DB_NAME:-swiftride_payment}
      POSTGRES_USER: ${PAYMENT_DB_USER:-swiftride}
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD:-swiftride_dev}
    ports:
      - "5434:5432"
    volumes:
      - payment-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PAYMENT_DB_USER:-swiftride} -d ${PAYMENT_DB_NAME:-swiftride_payment}"]
      interval: 5s
      timeout: 5s
      retries: 10

  trip-service:
    build:
      context: .
      dockerfile: src/TripService/Dockerfile
    environment:
      <<: *service-security
      ASPNETCORE_URLS: http://+:8080
      Services__MatchingService__BaseUrl: http://matching-service:8080/
      # Saga thanh toán: hạn chờ kết quả trước khi hủy (Failed) và bù trừ nếu tiền về muộn.
      TripPayment__TimeoutSeconds: ${TRIP_PAYMENT_TIMEOUT_SECONDS:-600}
      # config/trip/trip-matching.json (k, TTL lời mời, bán kính) tự nạp lại; polling vì bind mount trên Windows/macOS không phát sự kiện file.
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
      Database__Migrate: "true"
      ConnectionStrings__TripDb: Host=trip-postgres;Port=5432;Database=${TRIP_DB_NAME:-swiftride_trip};Username=${TRIP_DB_USER:-swiftride};Password=${TRIP_DB_PASSWORD:-swiftride_dev}
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__VirtualHost: ${RABBITMQ_VHOST:-swiftride}
      RabbitMq__Username: ${RABBITMQ_USER:-swiftride}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-swiftride_dev}
    volumes:
      - ./config/trip:/app/config:ro
    depends_on:
      keycloak:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      messaging-setup:
        condition: service_completed_successfully
      trip-postgres:
        condition: service_healthy
      matching-service:
        condition: service_started
    ports:
      - "5101:8080"

  matching-service:
    build:
      context: .
      dockerfile: src/MatchingService/Dockerfile
    environment:
      # config/matching/matching-settings.json (đơn giá, VAT, phí phụ, TTL vị trí) tự nạp lại khi đổi.
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
      <<: *service-security
      ASPNETCORE_URLS: http://+:8080
      ServiceAuth__ServiceName: matching-service
      Services__TripService__BaseUrl: http://trip-service:8080/
      ConnectionStrings__MatchDb: mongodb://matching-mongodb:27017/${MATCH_DB_NAME:-swiftride_matching}
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__VirtualHost: ${RABBITMQ_VHOST:-swiftride}
      RabbitMq__Username: ${RABBITMQ_USER:-swiftride}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-swiftride_dev}
    volumes:
      - ./config/matching:/app/config:ro
    depends_on:
      keycloak:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      matching-mongodb:
        condition: service_healthy
      messaging-setup:
        condition: service_completed_successfully
    ports:
      - "5102:8080"

  payment-service:
    build:
      context: .
      dockerfile: src/PaymentService/Dockerfile
    environment:
      <<: *service-security
      ASPNETCORE_URLS: http://+:8080
      Database__Migrate: "true"
      ServiceAuth__ServiceName: payment-service
      Services__TripService__BaseUrl: http://trip-service:8080/
      ConnectionStrings__PaymentDb: Host=payment-postgres;Port=5432;Database=${PAYMENT_DB_NAME:-swiftride_payment};Username=${PAYMENT_DB_USER:-swiftride};Password=${PAYMENT_DB_PASSWORD:-swiftride_dev}
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__VirtualHost: ${RABBITMQ_VHOST:-swiftride}
      RabbitMq__Username: ${RABBITMQ_USER:-swiftride}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-swiftride_dev}
    depends_on:
      keycloak:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      payment-postgres:
        condition: service_healthy
      messaging-setup:
        condition: service_completed_successfully
    ports:
      - "5103:8080"

  keycloak-postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_dev}
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_dev}
      # Issuer is fixed to the public URL; containers fetch metadata/JWKS through the backchannel.
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-keycloak-admin-dev}
      # Realm import resolves ${DEV_ACCOUNT_PASSWORD} for the seeded demo accounts (first import only).
      DEV_ACCOUNT_PASSWORD: ${DEV_ACCOUNT_PASSWORD:-SwiftRide-demo-2026!}
      # Secret of client swiftride-registration (Gateway creates Rider accounts for in-app sign-up).
      REGISTRATION_CLIENT_SECRET: ${REGISTRATION_CLIENT_SECRET:-swiftride-registration-dev-secret}
    volumes:
      - ./keycloak/swiftride-realm.json:/opt/keycloak/data/import/swiftride-realm.json:ro
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
    ports:
      - "8180:8080"

  api-gateway:
    build:
      context: .
      dockerfile: src/ApiGateway/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      Authentication__Authority: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}/realms/swiftride
      Authentication__MetadataAddress: http://keycloak:8080/realms/swiftride/.well-known/openid-configuration
      Authentication__RequireHttpsMetadata: "false"
      Authentication__Audience: swiftride-api
      # In-app Rider sign-up: POST /api/auth/register -> Keycloak Admin API (service account, manage-users only)
      Registration__KeycloakUrl: http://keycloak:8080
      Registration__ClientSecret: ${REGISTRATION_CLIENT_SECRET:-swiftride-registration-dev-secret}
      # YARP cluster destinations (routes are in src/ApiGateway/appsettings.json)
      ReverseProxy__Clusters__trip__Destinations__primary__Address: http://trip-service:8080/
      ReverseProxy__Clusters__matching__Destinations__primary__Address: http://matching-service:8080/
      ReverseProxy__Clusters__payment__Destinations__primary__Address: http://payment-service:8080/
    depends_on:
      keycloak:
        condition: service_healthy
      trip-service:
        condition: service_started
      matching-service:
        condition: service_started
      payment-service:
        condition: service_started
    ports:
      - "5100:8080"

volumes:
  rabbitmq-data:
  keycloak-postgres-data:
  trip-postgres-data:
  matching-mongo-data:
  payment-postgres-data:
